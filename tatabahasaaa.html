<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  /* ═══════════════════════════════════════════════════
     CSS LOKAL tatabahasa.html
  ═══════════════════════════════════════════════════ */
  .tb-layout {
    max-width: 760px;
    margin: 0 auto;
    padding: calc(var(--nav-h) + 24px) 20px 40px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .tb-header { text-align: center; }
  .tb-header h1 {
    font-size: 1.3rem; color: var(--text-main); font-weight: 500; margin-bottom: 4px;
  }
  .tb-header p { font-size: 0.84rem; color: var(--text-muted); }

  .tb-breadcrumb {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    font-size: 0.82rem; color: var(--text-dim);
  }
  .tb-breadcrumb span.tb-crumb-link {
    color: var(--gold); cursor: pointer;
  }
  .tb-breadcrumb span.tb-crumb-link:hover { text-decoration: underline; }
  .tb-breadcrumb .tb-sep { color: var(--text-muted); }

  .tb-back-btn {
    align-self: flex-start;
    padding: 6px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg-card2);
    color: var(--text-dim);
    font-size: 0.82rem;
    cursor: pointer;
  }
  .tb-back-btn:hover { color: var(--text-main); border-color: var(--gold-dim); }

  /* ── Grid level HSK ─────────────────────────────────── */
  .tb-level-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .tb-level-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 10px;
    text-align: center;
    cursor: pointer;
    transition: all var(--transition);
  }
  .tb-level-card:hover {
    border-color: var(--gold-dim);
    background: var(--gold-bg);
  }
  .tb-level-card .tb-level-num {
    font-size: 1.4rem; color: var(--gold); font-weight: 600;
  }
  .tb-level-card .tb-level-label {
    font-size: 0.72rem; color: var(--text-muted); margin-top: 2px;
  }
  .tb-level-card .tb-level-count {
    font-size: 0.72rem; color: var(--text-dim); margin-top: 6px;
  }

  /* ── List kategori / poin ───────────────────────────── */
  .tb-list { display: flex; flex-direction: column; gap: 8px; }

  .tb-cat-card, .tb-point-card {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor: pointer;
    transition: all var(--transition);
  }
  .tb-cat-card:hover, .tb-point-card:hover {
    border-color: var(--gold-dim);
    background: var(--gold-bg);
  }
  .tb-cat-card .tb-cat-name, .tb-point-card .tb-point-title {
    color: var(--text-main); font-size: 0.92rem;
  }
  .tb-point-card .tb-point-num {
    color: var(--gold); font-size: 0.78rem; margin-right: 8px;
  }
  .tb-cat-count, .tb-point-arrow {
    color: var(--text-muted); font-size: 0.78rem; flex-shrink: 0;
  }

  .tb-kesalahan-entry {
    display: flex; align-items: center; gap: 10px;
    background: var(--red-bg);
    border: 1px solid var(--border-gold);
    border-radius: var(--radius);
    padding: 12px 16px;
    cursor: pointer;
    color: var(--text-main);
    font-size: 0.88rem;
  }
  .tb-kesalahan-entry:hover { border-color: var(--red); }

  .tb-search {
    width: 100%;
    padding: 10px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg-input);
    color: var(--text-main);
    font-size: 0.88rem;
  }
  .tb-search::placeholder { color: var(--text-muted); }

  .tb-empty { text-align: center; color: var(--text-muted); padding: 40px 20px; }

  /* ── Detail poin ────────────────────────────────────── */
  .tb-detail-title {
    font-size: 1.15rem; color: var(--text-main); font-weight: 500;
  }
  .tb-detail-fungsi {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 0.88rem;
    color: var(--text-dim);
    line-height: 1.55;
  }
  .tb-detail-fungsi strong { color: var(--gold); }

  .tb-pattern-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .tb-pattern-jenis {
    display: inline-block;
    align-self: flex-start;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--gold-bg);
    color: var(--gold);
    border: 1px solid var(--gold-dim);
  }
  .tb-pattern-pola {
    font-size: 0.82rem;
    color: var(--text-dim);
    font-family: monospace;
  }
  .tb-pattern-row {
    display: flex; align-items: center; gap: 10px;
  }
  .tb-pattern-contoh {
    font-size: 1.15rem; color: var(--text-main); font-weight: 300;
  }
  .tb-pattern-speak-btn {
    flex-shrink: 0;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--gold-dim);
    background: var(--gold-bg);
    color: var(--gold);
    font-size: 1rem;
    cursor: pointer;
  }
  .tb-pattern-speak-btn:hover { background: var(--gold-bg-hover); }
  .tb-pattern-pinyin { font-size: 0.86rem; color: var(--gold); }
  .tb-pattern-terjemahan { font-size: 0.82rem; color: var(--text-dim); }
  .tb-pattern-placeholder {
    font-size: 0.82rem; color: var(--text-muted); font-style: italic;
  }

  /* ── Reference table (afiks/idiom/sinonim tanpa skema Jenis) ─ */
  .tb-ref-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .tb-ref-form {
    font-size: 1.05rem; color: var(--text-main); font-weight: 400;
  }
  .tb-ref-contoh { font-size: 0.9rem; color: var(--gold); }
  .tb-ref-arti { font-size: 0.82rem; color: var(--text-dim); }

  /* ── Kesalahan Umum ─────────────────────────────────── */
  .tb-kesalahan-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .tb-kesalahan-kategori {
    font-size: 0.76rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em;
  }
  .tb-kesalahan-pair {
    display: flex; flex-direction: column; gap: 4px;
  }
  .tb-kesalahan-salah { color: #d97070; font-size: 0.95rem; }
  .tb-kesalahan-salah::before { content: "❌ "; }
  .tb-kesalahan-benar { color: #7ac47a; font-size: 0.95rem; }
  .tb-kesalahan-benar::before { content: "✅ "; }
  .tb-kesalahan-penjelasan { font-size: 0.82rem; color: var(--text-dim); }
</style>
</head>

<div class="tb-layout">

  <div class="tb-header">
    <h1>📘 Dunia Tata Bahasa</h1>
    <p>Rujukan lengkap pola kalimat per level HSK — bukan latihan, tapi bahan baca.</p>
  </div>

  <div id="tb-breadcrumb-wrap"></div>
  <div id="tb-main-area">
    <div class="tb-empty" id="tb-loading-state">Memuat data tata bahasa…</div>
  </div>

</div>

<div class="toast-wrap" id="toast-wrap"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   tatabahasa.html — Dunia Tata Bahasa
   Sumber data: data/grammar_hsk{1..9}.json (satu file per level,
   dimuat lazy saat level itu dibuka pertama kali).
═══════════════════════════════════════════════════════════════ */

const TB_LEVELS = [1,2,3,4,5,6,7,8,9];

/* Cross-link ke Word Builder: poin gramatika id -> kunci pola Word Builder
   (lihat PATTERNS di wordbuilder.html). Dipetakan manual dengan cek satu-
   satu formula tiap poin cocok dengan formula polanya (bukan tebak dari
   judul saja) -- 32 dari 34 pola Word Builder berhasil dipetakan. 2 sisanya
   (S-V polos, S-T-V-O) sengaja tidak dipetakan karena tidak ada poin
   gramatika HSK yang secara spesifik membahasnya sebagai satu topik. */
const POINT_TO_WB_PATTERN = {
  'hsk1-40': 'S-V-O',
  'hsk1-41': 'S-shi-O',
  'hsk1-42': 'S-you-O',
  'hsk1-37': 'S-zai-L',
  'hsk1-44': 'S-hen-Adj',
  'hsk1-33': 'S-bu-Adj',
  'hsk1-46': 'S-tai-Adj-le',
  'hsk1-7':  'S-Num-M-N',
  'hsk2-3.2':'S-V-guo',
  'hsk1-22': 'S-V-le',
  'hsk1-35': 'S-zai-V',
  'hsk1-19': 'Q-ma',
  'hsk1-20': 'Q-ne',
  'hsk1-52': 'Q-shenme',
  'hsk1-54': 'Q-zenme',
  'hsk1-55': 'Q-duoshao',
  'hsk2-6.1':'C-yinwei-suoyi',
  'hsk2-6.2':'C-suiran-danshi',
  'hsk3-6.1':'C-ruguo-jiu',
  'hsk4-6.3':'C-bujin-erqie',
  'hsk3-6.7':'C-yibian-yibian',
  'hsk3-5.3':'C-bi',
  'hsk2-14.3':'C-meiyou',
  'hsk3-5.4':'C-yiyang',
  'hsk1-6':  'F-keyi',
  'hsk1-5':  'F-yao',
  'hsk1-3':  'F-xiang',
  'hsk2-15.1':'F-qing',
  'hsk3-5.1':'F-ba',
  'hsk3-5.2':'F-bei',
  'hsk2-5.5':'F-gei',
  'hsk5-8.10':'F-cong-dao',
};

// Nama pola untuk label tombol (dari PATTERNS.name di wordbuilder.html --
// disalin manual di sini, karena tatabahasa.html berdiri sendiri, tidak
// memuat data pola Word Builder).
const WB_PATTERN_LABEL = {
  'S-V-O': 'Subjek + Kata Kerja + Objek', 'S-shi-O': 'S + 是 + O',
  'S-you-O': 'S + 有 + O', 'S-zai-L': 'S + 在 + Tempat',
  'S-hen-Adj': 'S + 很 + Kata Sifat', 'S-bu-Adj': 'S + 不 + Sifat/KK',
  'S-tai-Adj-le': 'S + 太…了', 'S-Num-M-N': 'Angka + Satuan + Nomina',
  'S-V-guo': 'S + V + 过', 'S-V-le': 'S + V + 了', 'S-zai-V': 'S + 在 + V',
  'Q-ma': 'Pertanyaan + 吗', 'Q-ne': 'Topik + 呢', 'Q-shenme': 'S + V + 什么',
  'Q-zenme': '怎么 + V', 'Q-duoshao': '多少 / 几',
  'C-yinwei-suoyi': '因为…所以', 'C-suiran-danshi': '虽然…但是',
  'C-ruguo-jiu': '如果…就', 'C-bujin-erqie': '不仅…而且',
  'C-yibian-yibian': '一边…一边', 'C-bi': 'A + 比 + B + Adj',
  'C-meiyou': 'A + 没有 + B + Adj', 'C-yiyang': 'A + 跟 B + 一样 + Adj',
  'F-keyi': '可以', 'F-yao': '要', 'F-xiang': '想', 'F-qing': '请',
  'F-ba': '把', 'F-bei': '被', 'F-gei': '给', 'F-cong-dao': '从…到',
};

function goToWordBuilderPattern(patternKey) {
  try { localStorage.setItem('wb_ref_pattern', patternKey); } catch (e) { /* abaikan senyap */ }
  location.href = 'wordbuilder.html';
}

const TB_STATE = {
  screen:   'level',   // 'level' | 'category' | 'points' | 'detail' | 'kesalahan' | 'search'
  level:    null,
  catIndex: null,
  pointId:  null,
  cache:    {},         // level -> data json
  filter:   '',
  searchQuery: '',      // query aktif utk screen 'search'
};

const TB_LAST_STATE_KEY = 'mandarin_tatabahasa_last_state_v1';

function saveTbLastState() {
  try {
    localStorage.setItem(TB_LAST_STATE_KEY, JSON.stringify({
      screen: TB_STATE.screen, level: TB_STATE.level,
      catIndex: TB_STATE.catIndex, pointId: TB_STATE.pointId,
    }));
  } catch (e) { /* abaikan senyap */ }
}

function restoreTbLastState() {
  try {
    const saved = JSON.parse(localStorage.getItem(TB_LAST_STATE_KEY) || 'null');
    if (!saved) return null;
    return saved;
  } catch (e) { return null; }
}

/* ── MUAT DATA LEVEL (lazy, di-cache) ──────────────────────── */
async function loadLevelData(level) {
  if (TB_STATE.cache[level]) return TB_STATE.cache[level];
  const res = await fetch(`data/grammar_hsk${level}.json`);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  TB_STATE.cache[level] = data;
  return data;
}

/* ── BREADCRUMB ─────────────────────────────────────────────── */
function renderBreadcrumb() {
  const wrap = $('tb-breadcrumb-wrap');
  const parts = [`<span class="tb-crumb-link" onclick="goToLevelScreen()">HSK</span>`];
  if (TB_STATE.level) {
    parts.push(`<span class="tb-sep">›</span>`);
    parts.push(`<span class="tb-crumb-link" onclick="goToCategoryScreen(${TB_STATE.level})">HSK ${TB_STATE.level}</span>`);
  }
  if (TB_STATE.screen === 'points' && TB_STATE.catIndex !== null) {
    const cat = TB_STATE.cache[TB_STATE.level].categories[TB_STATE.catIndex];
    parts.push(`<span class="tb-sep">›</span><span>${escHtml(cat.name)}</span>`);
  }
  if (TB_STATE.screen === 'detail') {
    const cat = TB_STATE.cache[TB_STATE.level].categories[TB_STATE.catIndex];
    parts.push(`<span class="tb-sep">›</span><span class="tb-crumb-link" onclick="goToPointsScreen(${TB_STATE.level}, ${TB_STATE.catIndex})">${escHtml(cat.name)}</span>`);
    parts.push(`<span class="tb-sep">›</span><span>Detail</span>`);
  }
  if (TB_STATE.screen === 'kesalahan') {
    parts.push(`<span class="tb-sep">›</span><span>⚠️ Kesalahan Umum</span>`);
  }
  if (TB_STATE.screen === 'search') {
    parts.push(`<span class="tb-sep">›</span><span>🔍 Pencarian: "${escHtml(TB_STATE.searchQuery)}"</span>`);
  }
  wrap.innerHTML = `<div class="tb-breadcrumb">${parts.join('')}</div>`;
}

/* ── SCREEN 1: PILIH LEVEL ──────────────────────────────────── */
async function goToLevelScreen() {
  TB_STATE.screen = 'level';
  TB_STATE.level = null; TB_STATE.catIndex = null; TB_STATE.pointId = null;
  saveTbLastState();
  renderBreadcrumb();

  const area = $('tb-main-area');
  area.innerHTML = `<div class="tb-empty">Memuat ringkasan level…</div>`;

  // Muat semua level (ringan, cuma untuk hitung jumlah poin di tiap kartu)
  const counts = {};
  await Promise.all(TB_LEVELS.map(async (lvl) => {
    try {
      const d = await loadLevelData(lvl);
      counts[lvl] = d.categories.reduce((sum, c) => sum + c.points.length, 0);
    } catch (e) {
      counts[lvl] = null;
    }
  }));

  area.innerHTML = `
    <div class="tb-level-grid">
      ${TB_LEVELS.map(lvl => `
        <div class="tb-level-card" onclick="goToCategoryScreen(${lvl})">
          <div class="tb-level-num">HSK ${lvl}</div>
          <div class="tb-level-count">${counts[lvl] === null ? 'data belum ada' : counts[lvl] + ' poin'}</div>
        </div>
      `).join('')}
    </div>
  `;
}

/* ── SCREEN 2: DAFTAR KATEGORI ──────────────────────────────── */
async function goToCategoryScreen(level) {
  TB_STATE.screen = 'category';
  TB_STATE.level = level; TB_STATE.catIndex = null; TB_STATE.pointId = null;
  saveTbLastState();

  const area = $('tb-main-area');
  area.innerHTML = `<div class="tb-empty">Memuat kategori HSK ${level}…</div>`;

  let data;
  try {
    data = await loadLevelData(level);
  } catch (e) {
    area.innerHTML = `<div class="tb-empty">⚠ Gagal memuat data HSK ${level}.<br>Pastikan <code>data/grammar_hsk${level}.json</code> ada di folder <code>data/</code>.</div>`;
    return;
  }
  renderBreadcrumb();

  const kesalahanBtn = data.kesalahan_umum && data.kesalahan_umum.length
    ? `<div class="tb-kesalahan-entry" onclick="goToKesalahanScreen()">⚠️ Kesalahan Umum HSK ${level} <span style="margin-left:auto;color:var(--text-muted)">${data.kesalahan_umum.length} item</span></div>`
    : '';

  area.innerHTML = `
    <button class="tb-back-btn" onclick="goToLevelScreen()">◀ Semua Level</button>
    ${kesalahanBtn}
    <div class="tb-list">
      ${data.categories.map((cat, i) => `
        <div class="tb-cat-card" onclick="goToPointsScreen(${level}, ${i})">
          <span class="tb-cat-name">${escHtml(cat.name)}</span>
          <span class="tb-cat-count">${cat.points.length} poin</span>
        </div>
      `).join('')}
    </div>
  `;
}

/* ── SCREEN 3: DAFTAR POIN ──────────────────────────────────── */
function goToPointsScreen(level, catIndex) {
  TB_STATE.screen = 'points';
  TB_STATE.level = level; TB_STATE.catIndex = catIndex; TB_STATE.pointId = null;
  TB_STATE.filter = '';
  saveTbLastState();
  renderBreadcrumb();
  renderPointsScreen();
}

function renderPointsScreen() {
  const data = TB_STATE.cache[TB_STATE.level];
  const cat  = data.categories[TB_STATE.catIndex];
  const area = $('tb-main-area');
  const q = TB_STATE.filter.trim().toLowerCase();
  const points = q
    ? cat.points.filter(p => p.title.toLowerCase().includes(q))
    : cat.points;

  area.innerHTML = `
    <button class="tb-back-btn" onclick="goToCategoryScreen(${TB_STATE.level})">◀ ${escHtml(cat.name)} — Kategori Lain</button>
    <input class="tb-search" id="tb-point-search" placeholder="Cari poin di kategori ini…" value="${escHtml(TB_STATE.filter)}" oninput="onTbPointSearch(this.value)">
    <div class="tb-list">
      ${points.length ? points.map(p => `
        <div class="tb-point-card" onclick="goToDetailScreen('${p.id}')">
          <span class="tb-point-title"><span class="tb-point-num">${escHtml(p.number)}</span>${escHtml(p.title)}</span>
          <span class="tb-point-arrow">▶</span>
        </div>
      `).join('') : `<div class="tb-empty">Tidak ada poin yang cocok dengan "${escHtml(TB_STATE.filter)}".</div>`}
    </div>
  `;
}

function onTbPointSearch(val) {
  TB_STATE.filter = val;
  renderPointsScreen();
}

/* ── SCREEN 4: DETAIL POIN ──────────────────────────────────── */
function goToDetailScreen(pointId) {
  TB_STATE.screen = 'detail';
  TB_STATE.pointId = pointId;
  saveTbLastState();
  renderBreadcrumb();

  const data = TB_STATE.cache[TB_STATE.level];
  const cat  = data.categories[TB_STATE.catIndex];
  const point = cat.points.find(p => p.id === pointId);
  const area = $('tb-main-area');

  if (!point) {
    area.innerHTML = `<div class="tb-empty">Poin tidak ditemukan.</div>`;
    return;
  }

  const JENIS_ORDER = ['Afirmatif','Negatif','Interogatif','Deklaratif','Imperatif','Ekslamatif','Optatif','Saran'];
  const rows = [...point.table].sort((a,b) => JENIS_ORDER.indexOf(a.jenis) - JENIS_ORDER.indexOf(b.jenis));
  const ref = point.reference_table;

  let bodyHtml;
  if (rows.length) {
    bodyHtml = rows.map(r => renderPatternCard(r)).join('');
  } else if (ref && ref.rows.length) {
    bodyHtml = ref.rows.map(r => renderRefCard(r, ref.headers)).join('');
  } else {
    bodyHtml = '<div class="tb-empty">Belum ada tabel pola untuk poin ini.</div>';
  }

  const patternKey = POINT_TO_WB_PATTERN[point.id];

  area.innerHTML = `
    <button class="tb-back-btn" onclick="goToPointsScreen(${TB_STATE.level}, ${TB_STATE.catIndex})">◀ ${escHtml(cat.name)}</button>
    <div class="tb-detail-title">${escHtml(point.title)}</div>
    ${point.fungsi ? `<div class="tb-detail-fungsi"><strong>Fungsi:</strong> ${escHtml(point.fungsi)}</div>` : ''}
    ${patternKey ? `
      <button onclick="goToWordBuilderPattern('${patternKey}')"
        style="align-self:flex-start;margin:8px 0 0;padding:8px 16px;border-radius:var(--radius);border:1px solid var(--gold-dim);background:var(--bg-card2);color:var(--gold);font-size:0.85rem;font-weight:600;cursor:pointer">
        🧩 Latih pola ini di Word Builder: ${escHtml(WB_PATTERN_LABEL[patternKey] || patternKey)} →
      </button>
    ` : ''}
    <div class="tb-list">
      ${bodyHtml}
    </div>
  `;
}

function renderRefCard(row, headers) {
  // headers biasanya ['Form', 'Contoh', 'Arti / Catatan'] tapi dibuat generik
  const form = row[headers[0]] || '';
  const contoh = row[headers[1]] || '';
  const arti = row[headers[2]] || '';
  return `
    <div class="tb-ref-card">
      ${form ? `
        <div class="tb-pattern-row">
          <span class="tb-ref-form">${escHtml(form)}</span>
          <button class="tb-pattern-speak-btn" onclick="speak('${escHtml(form).replace(/'/g, "\\'")}')" title="Dengarkan">🔊</button>
        </div>` : ''}
      ${contoh ? `<div class="tb-ref-contoh">${escHtml(contoh)}</div>` : ''}
      ${arti ? `<div class="tb-ref-arti">${escHtml(arti)}</div>` : ''}
    </div>
  `;
}

function renderPatternCard(r) {
  const isEmpty = !r.contoh || r.contoh.trim() === '—' || r.contoh.trim() === '-';
  return `
    <div class="tb-pattern-card">
      <span class="tb-pattern-jenis">${escHtml(r.jenis)}</span>
      ${r.pola ? `<div class="tb-pattern-pola">${escHtml(r.pola)}</div>` : ''}
      ${isEmpty
        ? `<div class="tb-pattern-placeholder">Bentuk ini tidak lazim / tidak berlaku untuk pola ini.</div>`
        : `
          <div class="tb-pattern-row">
            <div class="tb-pattern-contoh">${escHtml(r.contoh)}</div>
            <button class="tb-pattern-speak-btn" onclick="speak('${escHtml(r.contoh).replace(/'/g, "\\'")}')" title="Dengarkan">🔊</button>
          </div>
          ${r.pinyin ? `<div class="tb-pattern-pinyin">${escHtml(r.pinyin)}</div>` : ''}
          ${r.terjemahan ? `<div class="tb-pattern-terjemahan">${escHtml(r.terjemahan)}</div>` : ''}
        `}
    </div>
  `;
}

/* ── SCREEN 5: KESALAHAN UMUM ───────────────────────────────── */
function goToKesalahanScreen() {
  TB_STATE.screen = 'kesalahan';
  saveTbLastState();
  renderBreadcrumb();

  const data = TB_STATE.cache[TB_STATE.level];
  const area = $('tb-main-area');
  const items = data.kesalahan_umum || [];

  area.innerHTML = `
    <button class="tb-back-btn" onclick="goToCategoryScreen(${TB_STATE.level})">◀ HSK ${TB_STATE.level} — Kategori</button>
    <div class="tb-list">
      ${items.length ? items.map(k => `
        <div class="tb-kesalahan-card">
          ${k.kategori ? `<div class="tb-kesalahan-kategori">${escHtml(k.kategori)}</div>` : ''}
          <div class="tb-kesalahan-pair">
            <div class="tb-kesalahan-salah">${escHtml(k.salah)}</div>
            ${k.benar && k.benar !== '—' ? `<div class="tb-kesalahan-benar">${escHtml(k.benar)}</div>` : ''}
          </div>
          ${k.penjelasan && k.penjelasan !== '—' ? `<div class="tb-kesalahan-penjelasan">${escHtml(k.penjelasan)}</div>` : ''}
        </div>
      `).join('') : '<div class="tb-empty">Belum ada data kesalahan umum untuk level ini.</div>'}
    </div>
  `;
}

/* ── PENCARIAN GLOBAL LINTAS-LEVEL (utk deep-link dari halaman lain,
   mis. peta-bahasa.html#tatabahasa#search=把,被) ──────────────────
   Dipakai lewat hash: tatabahasa.html#search=QUERY
   QUERY boleh berisi beberapa kata kunci dipisah koma (OR match),
   mis. #search=会,能,可以,应该 -> cocok kalau judul poin mengandung
   SALAH SATU dari token tsb. Kalau hasil persis 1 poin, langsung
   lompat ke detail poin itu (pengalaman setara direct-link). Kalau
   lebih dari 1, tampilkan daftar hasil yang bisa diklik. Kalau 0,
   tampilkan pesan + tombol kembali ke grid HSK. */
async function loadAllLevelsTolerant() {
  await Promise.all(TB_LEVELS.map(async (lvl) => {
    if (TB_STATE.cache[lvl]) return;
    try { await loadLevelData(lvl); } catch (e) { /* level ini dilewati kalau file belum ada */ }
  }));
}

function searchPointsAcrossLevels(query) {
  const tokens = query.split(',').map(s => s.trim()).filter(Boolean);
  if (!tokens.length) return [];
  const results = [];
  TB_LEVELS.forEach(lvl => {
    const data = TB_STATE.cache[lvl];
    if (!data) return;
    data.categories.forEach((cat, catIndex) => {
      cat.points.forEach(point => {
        const hay = (point.title || '') + ' ' + (point.fungsi || '');
        if (tokens.some(t => hay.includes(t))) {
          results.push({ level: lvl, catIndex, catName: cat.name, point });
        }
      });
    });
  });
  return results;
}

async function renderGlobalSearchScreen(rawQuery) {
  TB_STATE.screen = 'search';
  TB_STATE.searchQuery = rawQuery;
  TB_STATE.level = null; TB_STATE.catIndex = null; TB_STATE.pointId = null;
  renderBreadcrumb();

  const area = $('tb-main-area');
  area.innerHTML = `<div class="tb-empty">Mencari "${escHtml(rawQuery)}" di semua level HSK…</div>`;

  await loadAllLevelsTolerant();
  const results = searchPointsAcrossLevels(rawQuery);

  if (results.length === 1) {
    const r = results[0];
    TB_STATE.level = r.level; TB_STATE.catIndex = r.catIndex;
    goToDetailScreen(r.point.id);
    return;
  }

  if (!results.length) {
    area.innerHTML = `
      <div class="tb-empty">
        Tidak ada poin tata bahasa yang cocok dengan "${escHtml(rawQuery)}".<br>
        <button class="tb-back-btn" style="margin-top:12px" onclick="goToLevelScreen()">◀ Jelajahi Semua Level HSK</button>
      </div>`;
    return;
  }

  area.innerHTML = `
    <button class="tb-back-btn" onclick="goToLevelScreen()">◀ Semua Level</button>
    <div class="tb-list">
      ${results.map(r => `
        <div class="tb-point-card" onclick="openSearchResult(${r.level}, ${r.catIndex}, '${r.point.id}')">
          <span class="tb-point-title">
            <span class="tb-point-num">HSK${r.level}</span>${escHtml(r.catName)} — ${escHtml(r.point.title)}
          </span>
          <span class="tb-point-arrow">▶</span>
        </div>
      `).join('')}
    </div>
  `;
}

function openSearchResult(level, catIndex, pointId) {
  TB_STATE.level = level; TB_STATE.catIndex = catIndex;
  goToDetailScreen(pointId);
}

/* ── INIT: pulihkan posisi terakhir kalau ada ──────────────── */
async function initTataBahasa() {
  // Cek deep-link dulu: tatabahasa.html#search=QUERY (dipakai peta-bahasa.html
  // utk lompat langsung ke poin/kategori relevan, bukan cuma grid HSK kosong).
  const hashMatch = location.hash.match(/^#search=(.+)$/);
  if (hashMatch) {
    try {
      await renderGlobalSearchScreen(decodeURIComponent(hashMatch[1]));
    } catch (e) {
      console.error('Gagal memproses deep-link pencarian:', e);
      goToLevelScreen();
    }
    return;
  }

  const saved = restoreTbLastState();
  try {
    if (saved && saved.level) {
      await loadLevelData(saved.level);
      if (saved.screen === 'detail' && saved.catIndex !== null && saved.pointId) {
        TB_STATE.level = saved.level; TB_STATE.catIndex = saved.catIndex;
        goToDetailScreen(saved.pointId);
      } else if (saved.screen === 'points' && saved.catIndex !== null) {
        goToPointsScreen(saved.level, saved.catIndex);
      } else if (saved.screen === 'kesalahan') {
        TB_STATE.level = saved.level;
        goToKesalahanScreen();
      } else {
        goToCategoryScreen(saved.level);
      }
    } else {
      goToLevelScreen();
    }
  } catch (e) {
    console.error('Gagal memulihkan posisi terakhir:', e);
    goToLevelScreen();
  }
}

document.addEventListener('DOMContentLoaded', initTataBahasa);
</script>
