<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terjemah Bebas — Mandarin Interaktif</title>
  <link rel="stylesheet" href="shared/style.css" />
  <script src="shared/core.js"></script>
  <script src="shared/pinyin.js"></script>
  <script src="shared/audio.js"></script>
  <style>
    /* ═══════════════════════════════════════════════════
       CSS LOKAL terjemah-bebas.html
       Prefix "tb-" (Terjemah Bebas), gaya konsisten dengan
       graded-reader.html (gr-*) tapi namespace terpisah.
    ═══════════════════════════════════════════════════ */

    .tb-layout {
      max-width: 760px;
      margin: 0 auto;
      padding: calc(var(--nav-h) + 24px) 20px 60px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .tb-header {
      text-align: center;
    }

    .tb-header h1 {
      font-size: 1.3rem;
      color: var(--text-main);
      font-weight: 500;
      margin-bottom: 4px;
    }

    .tb-header p {
      font-size: 0.84rem;
      color: var(--text-muted);
    }

    .tb-status {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
    }

    .tb-status.error {
      color: #C97A4C;
    }

    .tb-input-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tb-textarea {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg, var(--radius));
      padding: 16px;
      font-size: 1.1rem;
      line-height: 1.8;
      color: var(--text-main);
      resize: vertical;
      min-height: 120px;
    }

    .tb-textarea:focus {
      border-color: var(--gold-dim);
    }

    .tb-input-controls {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .tb-btn {
      padding: 8px 16px;
      border-radius: var(--radius);
      font-size: 0.82rem;
      cursor: pointer;
    }

    .tb-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ── Hasil terjemahan ─────────────────────────────────── */
    .tb-result-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tb-result-title {
      font-size: 0.95rem;
      color: var(--text-dim);
    }

    .tb-passage-text {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg, var(--radius));
      padding: 24px;
      font-size: 1.3rem;
      line-height: 2.2;
      color: var(--text-main);
    }

    .tb-word {
      cursor: pointer;
      border-radius: 3px;
      transition: background var(--transition);
      padding: 1px 0;
    }

    .tb-word:hover {
      background: var(--gold-bg);
      color: var(--gold);
    }

    .tb-word.active {
      background: var(--gold-bg);
      color: var(--gold);
    }

    /* Penanda halus: kata yang hanya ada di kamus tambahan (CC-CIDICT),
       bukan di kamus utama app_words.json */
    .tb-word.tb-fallback {
      border-bottom: 1px dotted var(--text-muted);
    }

    /* ── Panel arti kata terklik ─────────────────────────── */
    .tb-lookup-panel {
      display: none;
      background: var(--bg-card2);
      border: 1px solid var(--border-gold);
      border-radius: var(--radius);
      padding: 12px 16px;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .tb-lookup-panel.visible {
      display: flex;
    }

    .tb-lookup-cn {
      font-size: 1.4rem;
      color: var(--text-main);
    }

    .tb-lookup-py {
      font-size: 1rem;
      color: var(--gold);
    }

    .tb-lookup-id {
      font-size: 0.86rem;
      color: var(--text-dim);
      flex: 1;
    }

    .tb-lookup-source {
      font-size: 0.68rem;
      padding: 2px 8px;
      border-radius: 99px;
      background: var(--bg-card2);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .tb-empty {
      text-align: center;
      color: var(--text-muted);
      padding: 30px 20px;
      font-size: 0.85rem;
      line-height: 1.7;
    }

    .tb-legend {
      font-size: 0.74rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* ── Toggle pinyin ─────────────────────────────────────── */
    .tb-toggle-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
    }

    .tb-toggle-switch {
      position: relative;
      width: 36px;
      height: 20px;
      border-radius: 99px;
      background: var(--bg-card2);
      border: 1px solid var(--border);
      transition: background var(--transition);
      flex-shrink: 0;
    }

    .tb-toggle-switch::after {
      content: '';
      position: absolute;
      top: 1px;
      left: 1px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: transform var(--transition), background var(--transition);
    }

    .tb-toggle-wrap.on .tb-toggle-switch {
      background: var(--gold-bg);
      border-color: var(--gold-dim);
    }

    .tb-toggle-wrap.on .tb-toggle-switch::after {
      transform: translateX(16px);
      background: var(--gold);
    }

    /* ── Daftar kata otomatis ─────────────────────────────── */
    .tb-wordlist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .tb-wordlist {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg, var(--radius));
      overflow: hidden;
    }

    .tb-wordlist-item {
      display: flex;
      align-items: baseline;
      gap: 14px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }

    .tb-wordlist-item:last-child {
      border-bottom: none;
    }

    .tb-wordlist-cn {
      font-size: 1.15rem;
      color: var(--text-main);
      min-width: 64px;
      flex-shrink: 0;
    }

    .tb-wordlist-py {
      font-size: 0.9rem;
      color: var(--gold);
      min-width: 84px;
      flex-shrink: 0;
    }

    .tb-wordlist.tb-hide-pinyin .tb-wordlist-py {
      display: none;
    }

    .tb-wordlist-id {
      font-size: 0.84rem;
      color: var(--text-dim);
      flex: 1;
    }

    .tb-wordlist-item.tb-fallback .tb-wordlist-cn {
      border-bottom: 1px dotted var(--text-muted);
    }
  </style>
</head>

<div class="tb-layout">

  <div class="tb-header">
    <h1>🔍 Terjemah Bebas</h1>
    <p>Tempel teks Mandarin dari mana saja — tekan Terjemahkan untuk lihat daftar arti tiap kata sekaligus.</p>
  </div>

  <div class="tb-status" id="tb-status">Memuat kamus…</div>

  <div class="tb-input-wrap">
    <textarea class="tb-textarea" id="tb-input" placeholder="Tempel atau ketik teks Mandarin di sini…"></textarea>
    <div class="tb-input-controls">
      <button class="tb-btn btn-secondary" onclick="clearInput()">Bersihkan</button>
      <button class="tb-btn btn-primary" id="tb-translate-btn" onclick="translateInput()" disabled>Terjemahkan</button>
    </div>
  </div>

  <div id="tb-result-area"></div>

</div>

<div class="toast-wrap" id="toast-wrap"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   terjemah-bebas.html — Modul Terjemah Bebas (Tier 3)
   Sumber data:
     - data/app_words.json    → kamus utama (prioritas 1)
     - data/cidict_index.json → CC-CIDICT, 125rb+ entri (fallback)
   Tidak ada state tersimpan lintas-sesi (khusus scratch/teks bebas);
   hanya teks input terakhir yang diingat via localStorage supaya
   tidak hilang kalau رسلان pindah halaman lalu balik lagi.
═══════════════════════════════════════════════════════════════ */

const TB = {
  appMap:      new Map(),  // key: simplified → entri app_words.json
  cidictMap:   new Map(),  // key: simplified → entri cidict_index.json
  appMaxLen:    1,
  cidictMaxLen: 1,
  ready:        false,
};

const TB_LAST_TEXT_KEY = 'mandarin_tb_last_text';

// Pola arti yang harus dilewati saat memilih arti pertama yang layak
// tampil (sisa artefak CC-CEDICT: varian, marga, singkatan wilayah, dst).
const TB_BAD_MEANING_PATTERNS = [
  /^varian dari/i, /^marga\s/i, /^KP:/i, /^Taiwan dibaca/i,
];

function pickMeaning(meanings) {
  if (!Array.isArray(meanings) || !meanings.length) return '';
  const good = meanings.find(m => !TB_BAD_MEANING_PATTERNS.some(p => p.test(m)));
  return good || meanings[0];
}

/* ── MUAT KEDUA KAMUS ──────────────────────────────────────── */
async function loadDictionaries() {
  try {
    const [appRes, cidictRes] = await Promise.all([
      fetch('data/app_words.json'),
      fetch('data/cidict_index.json'),
    ]);
    if (!appRes.ok)    throw new Error('app_words.json HTTP ' + appRes.status);
    if (!cidictRes.ok) throw new Error('cidict_index.json HTTP ' + cidictRes.status);

    const appRaw    = await appRes.json();
    const cidictRaw = await cidictRes.json();

    // app_words.json bisa berupa array langsung ATAU dibungkus objek
    // (mis. {"words":[...]}) — coba beberapa kemungkinan umum. Kalau
    // ternyata key pembungkusnya beda, cukup tambah nama key di baris
    // di bawah ini.
    const appList = Array.isArray(appRaw)
      ? appRaw
      : (appRaw.words || appRaw.data || appRaw.entries || []);

    appList.forEach(w => {
      if (!w || !w.simplified) return;
      if (!TB.appMap.has(w.simplified)) TB.appMap.set(w.simplified, w);
      if (w.simplified.length > TB.appMaxLen) TB.appMaxLen = w.simplified.length;
    });

    const cidictList = Array.isArray(cidictRaw) ? cidictRaw : [];
    cidictList.forEach(w => {
      if (!w || !w.simplified) return;
      // Kalau ada duplikat simplified di CC-CIDICT, ambil entri pertama saja
      if (!TB.cidictMap.has(w.simplified)) TB.cidictMap.set(w.simplified, w);
      if (w.simplified.length > TB.cidictMaxLen) TB.cidictMaxLen = w.simplified.length;
    });

    TB.ready = true;
    $('tb-status').textContent =
      `Kamus siap — ${TB.appMap.size.toLocaleString('id-ID')} kata utama + ` +
      `${TB.cidictMap.size.toLocaleString('id-ID')} kata tambahan (CC-CIDICT).`;
    $('tb-status').classList.remove('error');
    $('tb-translate-btn').disabled = false;

    restoreLastText();
  } catch (e) {
    console.error('Gagal memuat kamus:', e);
    $('tb-status').textContent =
      '⚠ Gagal memuat data kamus. Pastikan data/app_words.json dan data/cidict_index.json ada di folder data/.';
    $('tb-status').classList.add('error');
  }
}

/* ── TOKENIZER GABUNGAN (maximum matching, app_words prioritas) ──
   Karena kamusnya besar (bukan glossary kecil per-bacaan seperti di
   graded-reader.html), tidak efisien menyortir & memindai semua entri
   tiap posisi. Sebagai gantinya: dari panjang maksimum menurun ke 1,
   cek langsung via Map.has() (O(1) per percobaan). app_words.json
   dicek lebih dulu di tiap panjang, CC-CIDICT jadi fallback kalau
   tidak ketemu di panjang yang sama. */
function tokenizeFreeText(text) {
  const maxLen = Math.max(TB.appMaxLen, TB.cidictMaxLen, 1);
  const tokens = [];
  let i = 0;

  while (i < text.length) {
    let matched = null;
    let source  = null;
    const upper = Math.min(maxLen, text.length - i);

    for (let len = upper; len >= 1; len--) {
      const sub = text.substr(i, len);
      if (TB.appMap.has(sub)) { matched = TB.appMap.get(sub); source = 'app'; break; }
      if (TB.cidictMap.has(sub)) { matched = TB.cidictMap.get(sub); source = 'cidict'; break; }
    }

    if (matched) {
      const cn = text.substr(i, matched.simplified.length);
      tokens.push({
        type:   'word',
        cn,
        py:     matched.pinyin || '',
        id:     pickMeaning(matched.meanings_id),
        source,
      });
      i += matched.simplified.length;
    } else {
      tokens.push({ type: 'punct', cn: text[i] });
      i += 1;
    }
  }
  return tokens;
}

/* ── AKSI UI ───────────────────────────────────────────────── */
function translateInput() {
  if (!TB.ready) return;
  const text = $('tb-input').value.trim();
  const area = $('tb-result-area');

  if (!text) {
    area.innerHTML = '';
    return;
  }

  saveLastText(text);

  const tokens = tokenizeFreeText(text);
  const bodyHtml = tokens.map((t, idx) => {
    if (t.type === 'word') {
      const fallbackClass = t.source === 'cidict' ? ' tb-fallback' : '';
      return `<span class="tb-word${fallbackClass}" data-idx="${idx}" data-cn="${escHtml(t.cn)}" data-py="${escHtml(t.py)}" data-id="${escHtml(t.id)}" data-source="${t.source}">${escHtml(t.cn)}</span>`;
    }
    return escHtml(t.cn);
  }).join('');

  const showPinyin = getShowPinyin();
  const wordItemsHtml = tokens
    .filter(t => t.type === 'word')
    .map(t => {
      const fallbackClass = t.source === 'cidict' ? ' tb-fallback' : '';
      return `
        <div class="tb-wordlist-item${fallbackClass}">
          <span class="tb-wordlist-cn">${escHtml(t.cn)}</span>
          <span class="tb-wordlist-py">${escHtml(t.py)}</span>
          <span class="tb-wordlist-id">${escHtml(t.id) || '(arti tidak tersedia)'}</span>
        </div>`;
    }).join('');

  area.innerHTML = `
    <div class="tb-result-toolbar">
      <span class="tb-result-title">Teks (klik kata untuk arti singkat)</span>
      <button class="tb-btn btn-secondary" onclick="speakInputText()">🔊 Dengarkan</button>
    </div>
    <div class="tb-passage-text" id="tb-passage-text">${bodyHtml}</div>
    <div class="tb-lookup-panel" id="tb-lookup-panel">
      <span class="tb-lookup-cn" id="tb-lookup-cn"></span>
      <span class="tb-lookup-py" id="tb-lookup-py"></span>
      <span class="tb-lookup-id" id="tb-lookup-id"></span>
      <span class="tb-lookup-source" id="tb-lookup-source"></span>
    </div>

    <div class="tb-wordlist-header">
      <span class="tb-result-title">Daftar Kata &amp; Arti</span>
      <span class="tb-toggle-wrap${showPinyin ? ' on' : ''}" id="tb-toggle-pinyin" onclick="togglePinyinDisplay()">
        <span>Tampilkan Pinyin</span>
        <span class="tb-toggle-switch"></span>
      </span>
    </div>
    <div class="tb-wordlist${showPinyin ? '' : ' tb-hide-pinyin'}" id="tb-wordlist">
      ${wordItemsHtml || '<div class="tb-empty">Tidak ada kata yang dikenali.</div>'}
    </div>

    <div class="tb-legend">garis putus-putus di bawah kata = arti dari kamus tambahan CC-CIDICT, bukan kamus utama</div>
  `;

  document.querySelectorAll('.tb-word').forEach(span => {
    span.addEventListener('click', () => showWordLookup(span));
  });
}

/* ── TOGGLE TAMPILAN PINYIN (Tier 1) ─────────────────────────── */
const TB_SHOW_PINYIN_KEY = 'mandarin_tb_show_pinyin';

function getShowPinyin() {
  try {
    const saved = localStorage.getItem(TB_SHOW_PINYIN_KEY);
    return saved === null ? true : saved === '1';
  } catch (e) {
    return true;
  }
}

function togglePinyinDisplay() {
  const next = !getShowPinyin();
  try { localStorage.setItem(TB_SHOW_PINYIN_KEY, next ? '1' : '0'); } catch (e) { /* abaikan */ }

  $('tb-toggle-pinyin').classList.toggle('on', next);
  $('tb-wordlist').classList.toggle('tb-hide-pinyin', !next);
}

function showWordLookup(span) {
  document.querySelectorAll('.tb-word.active').forEach(el => el.classList.remove('active'));
  span.classList.add('active');

  $('tb-lookup-cn').textContent = span.dataset.cn;
  $('tb-lookup-py').textContent = span.dataset.py;
  $('tb-lookup-id').textContent = span.dataset.id || '(arti tidak tersedia)';
  $('tb-lookup-source').textContent = span.dataset.source === 'cidict' ? 'CC-CIDICT' : 'Kamus Utama';
  $('tb-lookup-panel').classList.add('visible');
}

function clearInput() {
  $('tb-input').value = '';
  $('tb-result-area').innerHTML = '';
  saveLastText('');
}

function speakInputText() {
  const text = $('tb-input').value.trim();
  if (!text) return;
  speak(text);
}

/* ── INGAT TEKS TERAKHIR (Tier 1) ─────────────────────────────── */
function saveLastText(text) {
  try { localStorage.setItem(TB_LAST_TEXT_KEY, text); } catch (e) { /* abaikan senyap */ }
}

function restoreLastText() {
  let saved = '';
  try { saved = localStorage.getItem(TB_LAST_TEXT_KEY) || ''; } catch (e) { /* abaikan */ }
  if (saved) {
    $('tb-input').value = saved;
    translateInput();
  }
}

/* ── INIT ───────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', loadDictionaries);
</script>

</body>
